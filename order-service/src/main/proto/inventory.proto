syntax = "proto3";

option java_package = "com.example.orderservice.grpc";
option java_multiple_files = true;

import "google/protobuf/empty.proto";

service InventoryService {
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse) {}
  rpc WriteOffProducts(WriteOffRequest) returns (google.protobuf.Empty) {}
}

message ProductItem {
  string id = 1;
  int32 quantity = 2;
}

message CheckAvailabilityRequest {
  repeated ProductItem product_items = 1;
}

message ProductAvailability {
  string id = 1;
  string name = 2;
  double price = 3;
  double sale = 4;
  int32 available_quantity = 5;
  bool isAvailable = 6;
}

message CheckAvailabilityResponse {
  repeated ProductAvailability product_availabilities = 1;
}

message WriteOffRequest {
  repeated ProductItem items = 1;
}